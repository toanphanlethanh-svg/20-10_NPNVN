<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Lời Chúc 20/10 Yêu Thương 🌸</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffe6eb 0%, #ffc3a0 50%, #ffa8a8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Container cho hiệu ứng hoa bay */
        #flower-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .flower {
            position: absolute;
            top: -50px;
            font-size: 20px;
            user-select: none;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0.2;
            }
        }

        /* Card Container */
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(220, 90, 120, 0.25);
            width: 90%;
            max-width: 480px;
            text-align: center;
            position: relative;
            z-index: 2;
            border: 2px solid rgba(255, 182, 193, 0.5);
            transition: all 0.3s ease;
        }

        h1 {
            color: #d81b60;
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Input Form */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #ffb6c1;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #d81b60;
            box-shadow: 0 0 10px rgba(216, 27, 96, 0.2);
        }

        button.btn-search {
            background: linear-gradient(45deg, #ff4081, #ff7043);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.3);
        }

        button.btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
        }

        button.btn-search:active {
            transform: translateY(1deg);
        }

        /* Animation tìm kiếm */
        .searching-status {
            display: none;
            margin: 20px 0;
            color: #d81b60;
            font-size: 15px;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(216, 27, 96, 0.2);
            border-radius: 50%;
            border-top-color: #d81b60;
            animation: spin 0.8s ease-in-out infinite;
            margin-bottom: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Giao diện Bức thư */
        .letter-box {
            display: none;
            margin-top: 15px;
            text-align: left;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .envelope {
            background: #fffdf9;
            border: 1px solid #f3d5d8;
            border-radius: 12px;
            padding: 20px;
            box-shadow: inset 0 0 10px rgba(255, 182, 193, 0.15);
            position: relative;
        }

        .letter-title {
            font-family: 'Dancing Script', cursive;
            color: #c2185b;
            font-size: 28px;
            margin-bottom: 12px;
            text-align: center;
        }

        .letter-content {
            color: #444;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-line; /* Giữ nguyên xuống dòng */
        }

        .letter-footer {
            margin-top: 15px;
            text-align: right;
            font-family: 'Dancing Script', cursive;
            font-size: 20px;
            color: #d81b60;
            font-weight: bold;
        }

        .btn-reset {
            margin-top: 15px;
            background: transparent;
            border: 1px dashed #d81b60;
            color: #d81b60;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            background: #ffe6eb;
        }

        /* Thông báo lỗi */
        .error-msg {
            color: #e53935;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Nhạc nền ẩn -->
    <audio id="bgMusic" loop autoplay>
        <source src="nhacnen.mp3" type="audio/mp3">
    </audio>

    <!-- Container cho hiệu ứng hoa bay -->
    <div id="flower-container"></div>

    <!-- Khung chính -->
    <div class="card">
        <h1>🌸 Chúc Mừng 20/10 🌸</h1>
        <p class="subtitle">Nhập tên của bạn để nhận bức thư bí mật nhé!</p>

        <!-- Form nhập tên -->
        <div id="search-section">
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="Ví dụ: Toàn, Phương, Trang..." autocomplete="off">
                <button class="btn-search" onclick="searchLetter()">Mở Bức Thư 💌</button>
            </div>
            <p class="error-msg" id="errorMsg">Rất tiếc, chưa tìm thấy thư cho tên này! Bạn thử nhập tên khác nhé.</p>
        </div>

        <!-- Trạng thái đang tìm thư -->
        <div class="searching-status" id="searchingStatus">
            <div class="spinner"></div>
            <p id="searchStepText">Đang tìm thư của bạn trong hòm thư yêu thương...</p>
        </div>

        <!-- Bức thư hiển thị -->
        <div class="letter-box" id="letterBox">
            <div class="envelope">
                <h2 class="letter-title" id="letterTitle">Gửi...</h2>
                <div class="letter-content" id="letterContent"></div>
                <div class="letter-footer" id="letterFooter">Thân gửi ✨</div>
            </div>
            <button class="btn-reset" onclick="resetSearch()">🔍 Tìm bức thư khác</button>
        </div>
    </div>

    <script>
        // ------------------------------------------------------------------
        // XỬ LÝ NHẠC NỀN TỰ ĐỘNG KHI MỞ TRANG / TƯƠNG TÁC ĐẦU TIÊN
        // ------------------------------------------------------------------
        const bgMusic = document.getElementById('bgMusic');
        let isPlaying = false;

        function playAudio() {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                }).catch(err => {
                    console.log("Trình duyệt chờ tương tác đầu tiên để phát nhạc:", err);
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            playAudio();
        });

        // Kích hoạt phát nhạc ở thao tác chạm/click đầu tiên bất kỳ trên màn hình
        function autoPlayOnFirstInteraction() {
            playAudio();
            document.removeEventListener('click', autoPlayOnFirstInteraction);
            document.removeEventListener('touchstart', autoPlayOnFirstInteraction);
        }

        document.addEventListener('click', autoPlayOnFirstInteraction);
        document.addEventListener('touchstart', autoPlayOnFirstInteraction);

        // ------------------------------------------------------------------
        // 1. DANH SÁCH BỨC THƯ CÁ NHÂN HÓA
        // ------------------------------------------------------------------
        const lettersDatabase = [
            {
                keywords: ["Phương", "phương", "phuong"],
                recipient: "Gửi Người Bạn thân của Toàn 🌸",
                content: `Alo alo, thông báo khẩn cấp gửi tới đồng chí Phương nhân dịp 20/10! 📢

Trước tiên, chúc Phương một ngày lễ tràn ngập niềm vui, lúc nào cũng cười tươi như hoa và rạng rỡ bất chấp mọi hoàn cảnh. Chúc nhan sắc ngày càng thăng hạng, tài khoản nhảy số liên tục và quan trọng nhất là: Nhớ lâu lâu đi chơi với ae nha! 😂

Đặc biệt, nhắc nhẹ là nhớ sắp xếp thời gian đi chơi với anh em nhiều nhiều nghen, trốn là không được đâu ak nghen. Chúc Phương luôn kiên định với con đường mình chọn, gặt hái thật nhiều thành công và lúc nào cũng hạnh phúc viên mãn nghen! ✨🥳`,
                sender: "Người bạn luôn ủng hộ bạn ✨"
            },
            {
                keywords: ["Đạika", "đạika", "Đaika", "daika"],
                recipient: "Gửi Chị Yêu Quý ❤️",
                content: `Kính gửi Đại ca vĩ đại nhân ngày Phụ nữ Việt Nam 20/10! 🙇‍♂️🙇‍♀️

Em xin phép gửi lời chúc chân thành nhất tới người chị của em, người dẫn dắt tâm huyết của em. Chúc đại ca luôn xinh đẹp lộng lẫy, công việc hanh thông, sếp quý đồng nghiệp mến và đặc biệt là lúc nào cũng giữ vững phong độ vui vẻ của mọi câu chuyện mỗi đêm. Đặc biệt nhớ kể em nghe nhiều câu chuyện drama ak nghen! 

Cảm ơn đại ca thời gian qua vì đã không quản ngại khó khăn, miệt mài cập nhật cho em những chiếc drama nóng hổi vừa thổi vừa ăn trên thị trường. Nhờ có những câu chuyện đó mà cuộc sống bớt nhàm chán đi hẳn đấy! Chúc đại ca hôm nay nhận được thật nhiều quà, hoa ngập nhà và ăn hoài không béo nhé. Đừng để một ai ăn hiếp mình ak nghen! 🍵✨`,
                sender: "Thằng Em của chị 💌"
            },
            {
                keywords: ["Trang", "Yến Trang", "trang", "yến trang", "yen trang"],
                recipient: "Gửi Bạn Yến Trang - Trùm Free Fire💐",
                content: `Happy 20/10 đến cô nàng Yến Trang siêu cấp đáng yêu! 🎉

Hôm nay là ngày của phụ nữ, chúc bạn luôn mạnh khỏe, hạnh phúc, lúc nào cũng cười thả ga và gặp toàn chuyện may mắn trên đời. 

Nghĩ lại thấy may mắn ghê khi có một đứa bạn để trút bầu tâm sự đủ thứ chuyện trên trời dưới đất. Cảm ơn Trang vì những lúc ngồi nghe tui "luyên thuyên" không hồi kết, hay những pha tấu hài cười địch, thậm chí là mấy câu chuyện cười "đỏ mặt" mang lại tính giải trí cực cao nữa chứ! Chúc bạn mãi giữ được năng lượng tích cực này, luôn xinh đẹp và sớm đạt được mọi ước mơ nha. Và nhớ bắn ff không có chửi bạn ak nghen. Mãi keo à! 🥳💖`,
                sender: "Bạn thân SIUUUUUU THÂN của Trang, bạn Toàn đẹp gái ❤️"
            },
            {
                keywords: ["Như Ý", "như ý", "Ý", "ý", "nhu y"], 
                recipient: "Gửi Bạn Như Ý Đáng Yêu 🌷",
                content: `Chúc mừng ngày 20/10 thật rực rỡ và ngọt ngào dành cho Như Ý nhé! 🌟

Nhân dịp ngày lễ đặc biệt này, chúc bạn mọi điều như ý (đúng như cái tên luôn nghen!): học hành/công việc thuận buồm xuôi gió, tiền tài rủng rỉnh, tình duyên phơi phới và lúc nào cũng giữ được nụ cười tỏa nắng trên môi.

Cảm ơn Ý vì đã luôn là một người bạn dễ thương, tinh tế và mang lại nguồn năng lượng cực kỳ dễ chịu cho mọi người xung quanh. Chúc bạn hôm nay đi chơi được tặng thật nhiều hoa, quà ngập tràn và có một ngày lễ thật trọn vẹn, hạnh phúc nhé! ✨💐`,
                sender: "Người bạn siuuuuu dễ thương ✨"
            },
            {
                keywords: ["Giang", "giang"], 
                recipient: "Gửi Người Bạn Đáng Yêu 🌷",
                content: `Alo 1 2 3 4, Toàn gửi đến đồng chí bạn Giang nhân ngày 20/10! 🛰️🌸

Chúc bạn Giang ngày hôm nay nhận được gấp đôi lượng quà, gấp ba lượng hoa và... được miễn toàn bộ mọi loại việc nặng nhọc trên đời! Chúc bạn luôn vững vàng, bản lĩnh nhưng cũng không kém phần ngọt ngào, lúc nào cũng rạng rỡ và tràn đầy nhựa sống.

Cảm ơn vì đã luôn đồng hành và mang lại những tiếng cười sảng khoái trong mọi cuộc vui. Chúc Giang một ngày 20/10 thật bùng nổ, ăn chơi xả láng không lo về giá và luôn hạnh phúc trên con đường mình đã chọn nhé! 💖✨`,
                sender: "Người bạn của bạn đó nghen ✨"
            },
            {
                keywords: ["Thuonn", "thuonn", "Chanh Thuonn", "chanh thuonn"],
                recipient: "Gửi Thuonn - Bà Trùm Tẻn Tẻn 👑",
                content: `Happy 20/10 gửi tới cạ cứng chuyên lập kèo của tui! 🌸

Nhân ngày Phụ nữ Việt Nam, chúc bạn tui luôn xinh đẹp rạng rỡ, thần thái ngút ngàn, công việc/học hành mượt mà và tài khoản lúc nào cũng rủng rỉnh để... sẵn sàng lên kèo đi chơi! 💰

Cảm ơn bạn vì đã luôn nhớ tới tui mỗi khi có quán ngon, cafe đẹp hay kèo vi vu nào hot. Nhờ có sự năng nổ rủ rê của bạn mà cuộc sống của tui bớt nhạt đi bao nhiêu luôn đó! 

Chúc bạn hôm nay nhận được thật nhiều hoa, quà ngập nhà và có một ngày lễ 20/10 thật tuyệt vời. Chuẩn bị tinh thần lên kèo đi chơi ăn mừng tiếp theo nghen, Nhớ là cho chị mượn mấy bộ đầm với son đồ ak nghen. Mãi keo à! 🥳`,
                sender: "Bạn của bạn 💌"
            },
            {
                keywords: ["default"],
                recipient: "Gửi Người Bạn Đáng Yêu 🌷",
                content: `Nhân ngày Phụ nữ Việt Nam 20/10, chúc bạn luôn xinh đẹp, rạng rỡ và đón nhận thật nhiều niềm vui cũng như sự may mắn trong cuộc sống!

Chúc bạn có một ngày 20/10 thật trọn vẹn và ngọt ngào! Cảm ơn vì bạn đã là bạn của Toàn. Tất cả đều là ae. ✨
Nhớ nhập đúng tên để nhận quà riêng nghen!`,
                sender: "Gửi tặng bạn 💐"
            }
        ];

        // ------------------------------------------------------------------
        // 2. CHỨC NĂNG TÌM VÀ MỞ THƯ VỚI HIỆU ỨNG
        // ------------------------------------------------------------------
        function normalizeString(str) {
            return str
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/g, "d")
                .trim();
        }

        function searchLetter() {
            playAudio(); // Phát nhạc nếu chưa bật
            const rawInput = document.getElementById('nameInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const searchSection = document.getElementById('search-section');
            const searchingStatus = document.getElementById('searchingStatus');
            const searchStepText = document.getElementById('searchStepText');
            const letterBox = document.getElementById('letterBox');

            if (!rawInput) {
                errorMsg.innerText = "Vui lòng nhập tên của bạn nhé!";
                errorMsg.style.display = "block";
                return;
            }

            errorMsg.style.display = "none";
            searchSection.style.display = "none";
            searchingStatus.style.display = "block";

            const cleanInput = normalizeString(rawInput);

            const steps = [
                `🔍 Đang tra cứu tên "${rawInput}" trong hệ thống...`,
                "🌸 Đang chọn phong bì thư xinh đẹp nhất...",
                "✨ Đang đính kèm hương hoa và lời chúc..."
            ];

            let currentStep = 0;
            searchStepText.innerText = steps[0];

            const stepInterval = setInterval(() => {
                currentStep++;
                if (currentStep < steps.length) {
                    searchStepText.innerText = steps[currentStep];
                } else {
                    clearInterval(stepInterval);
                    
                    let found = lettersDatabase.find(letter => 
                        letter.keywords.some(k => normalizeString(k) === cleanInput)
                    );

                    if (!found) {
                        found = lettersDatabase.find(letter => letter.keywords.includes("default"));
                    }

                    document.getElementById('letterTitle').innerText = found.recipient;
                    document.getElementById('letterContent').innerText = found.content;
                    document.getElementById('letterFooter').innerText = found.sender;

                    searchingStatus.style.display = "none";
                    letterBox.style.display = "block";
                }
            }, 700);
        }

        function resetSearch() {
            document.getElementById('letterBox').style.display = "none";
            document.getElementById('search-section').style.display = "block";
            document.getElementById('nameInput').value = "";
            document.getElementById('errorMsg').style.display = "none";
        }

        document.getElementById('nameInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchLetter();
            }
        });

        // ------------------------------------------------------------------
        // 3. HIỆU ỨNG HOA BAY XUNG QUANH (FALLING FLOWERS)
        // ------------------------------------------------------------------
        const flowerIcons = ['🌸', '🌺', '🌹', '🌷', '✨', '💐', '🌼'];
        const flowerContainer = document.getElementById('flower-container');

        function createFlower() {
            const flower = document.createElement('div');
            flower.classList.add('flower');
            
            flower.innerText = flowerIcons[Math.floor(Math.random() * flowerIcons.length)];
            flower.style.left = Math.random() * 100 + 'vw';
            
            const size = Math.random() * 15 + 15;
            flower.style.fontSize = size + 'px';
            
            const duration = Math.random() * 4 + 4;
            flower.style.animationDuration = duration + 's';
            flower.style.opacity = Math.random() * 0.7 + 0.3;

            flowerContainer.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }

        setInterval(createFlower, 300);
    </script>
</body>
</html>
